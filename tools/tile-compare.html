<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vrooom — Tile Style Comparison</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #f5f3ef;
    --fg: #2a2520;
    --muted: #9a948b;
    --accent: #f45436;
    --surface: rgba(255,255,255,0.92);
    --surface-border: rgba(0,0,0,0.06);
    --radius: 14px;
    --font: 'DM Sans', -apple-system, system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface-border);
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header h1 span { color: var(--accent); }

  .subtitle {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 400;
  }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    background: var(--surface-border);
  }

  .map-cell {
    position: relative;
    background: white;
  }

  .map-cell .map { width: 100%; height: 100%; }

  .map-label {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    pointer-events: none;
    white-space: nowrap;
  }

  .map-label .current-tag {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--accent);
    margin-left: 4px;
  }

  .map-label .load-time {
    font-size: 0.65rem;
    font-weight: 600;
    margin-left: 6px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(0,0,0,0.06);
  }

  .map-label .load-time.fast { color: #2e7d32; }
  .map-label .load-time.medium { color: #e65100; }
  .map-label .load-time.slow { color: #c62828; }

  /* sample markers legend */
  .legend {
    position: absolute;
    bottom: 30px;
    right: 10px;
    z-index: 1000;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 0.72rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 20px;
    background: #f0f4ff;
    border-bottom: 1px solid #d0d8f0;
    flex-wrap: wrap;
    font-size: 0.8rem;
  }

  .filter-bar .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-bar label {
    font-weight: 600;
    white-space: nowrap;
    min-width: 72px;
    color: #444;
  }

  .filter-bar input[type=range] {
    width: 90px;
    accent-color: var(--accent);
  }

  .filter-bar .val {
    min-width: 30px;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .filter-bar .reset-btn {
    padding: 4px 12px;
    border: 1.5px solid var(--surface-border);
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.75rem;
    font-weight: 500;
  }

  .filter-bar .css-output {
    font-family: monospace;
    font-size: 0.72rem;
    color: #555;
    background: white;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #d0d8f0;
    flex: 1;
    min-width: 200px;
    cursor: pointer;
    user-select: all;
  }

  .style-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface-border);
    flex-wrap: wrap;
  }

  .style-picker .picker-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-right: 4px;
  }

  .style-btn {
    padding: 4px 10px;
    border: 1.5px solid var(--surface-border);
    border-radius: 20px;
    background: white;
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.2s;
  }

  .style-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(244,84,54,0.06);
  }

  .style-btn:hover { border-color: var(--fg); color: var(--fg); }

  .leaflet-control-attribution { font-size: 9px !important; }

  /* "OSM Calm": the free OSM tiles, softened. Removes nothing from the
     drawing — only quiets the colours. Tune with the sliders, then copy. */
  .calm-tiles { filter: saturate(45%) brightness(108%) contrast(88%); }

  /* place-marker same as places-explorer */
  .place-marker { display: flex; align-items: center; justify-content: center; }
  .place-marker svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
</style>
</head>
<body>

<header>
  <h1><span>Vrooom</span> Tile Comparison</h1>
  <span class="subtitle">Free, keyless styles only — slot 1 is the current OSM Standard. Vector styles (◆) are drawn by the phone, and can have layers removed (Quiet, no POI): judge their speed on the cheapest one.</span>
</header>

<div class="filter-bar" id="filterBar">
  <div class="filter-group">
    <label>Warmth</label>
    <input type="range" id="f-sepia" min="0" max="60" value="0">
    <span class="val" id="v-sepia">0%</span>
  </div>
  <div class="filter-group">
    <label>Saturation</label>
    <input type="range" id="f-sat" min="40" max="160" value="100">
    <span class="val" id="v-sat">100%</span>
  </div>
  <div class="filter-group">
    <label>Brightness</label>
    <input type="range" id="f-bright" min="70" max="130" value="100">
    <span class="val" id="v-bright">100%</span>
  </div>
  <div class="filter-group">
    <label>Hue shift</label>
    <input type="range" id="f-hue" min="-30" max="30" value="0">
    <span class="val" id="v-hue">0°</span>
  </div>
  <button class="reset-btn" id="resetFilter">Reset</button>
  <span class="css-output" id="cssOutput" title="Click to copy">filter: none</span>
</div>

<div class="style-picker" id="stylePicker">
  <span class="picker-label">Slots 2-4:</span>
</div>

<div class="grid" id="grid">
  <div class="map-cell">
    <div class="map-label">OSM Standard <span class="current-tag">current</span></div>
    <div class="map" id="map0"></div>
  </div>
  <div class="map-cell">
    <div class="map-label" id="label1"></div>
    <div class="map" id="map1"></div>
  </div>
  <div class="map-cell">
    <div class="map-label" id="label2"></div>
    <div class="map" id="map2"></div>
  </div>
  <div class="map-cell">
    <div class="map-label" id="label3"></div>
    <div class="map" id="map3"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
(function() {
  'use strict';

  const MUNICH = [48.137, 11.575];
  const ZOOM = 15;

  // Free, keyless styles whose terms allow Vrooom's use. Paid ones (Stadia,
  // MapTiler, CARTO) were removed: their free plans forbid commercial use.
  //   raster: an image per tile, drawn by the server — works with plain Leaflet.
  //   vector: data per tile, drawn by the phone through MapLibre, plugged into
  //           Leaflet so markers, routes and the rest of map.js stay as they are.
  const OSM_ATTR = '&copy; OpenStreetMap contributors';
  const STYLES = {
    '__osm':      { name: 'OSM Standard', raster: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR },
    '__osm_calm': { name: 'OSM Calm', raster: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, className: 'calm-tiles' },
    '__hot':      { name: 'OSM HOT', raster: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', attr: OSM_ATTR + ' &middot; HOT, OSM France' },
    '__cyclosm':  { name: 'CyclOSM', raster: 'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', attr: OSM_ATTR + ' &middot; CyclOSM' },
    '__ofm_positron': { name: '◆ OpenFreeMap Positron', vector: 'https://tiles.openfreemap.org/styles/positron', attr: '<a href="https://openfreemap.org">OpenFreeMap</a> &middot; ' + OSM_ATTR },
    '__ofm_bright':   { name: '◆ OpenFreeMap Bright', vector: 'https://tiles.openfreemap.org/styles/bright', attr: '<a href="https://openfreemap.org">OpenFreeMap</a> &middot; ' + OSM_ATTR },
    '__ofm_liberty':  { name: '◆ OpenFreeMap Liberty', vector: 'https://tiles.openfreemap.org/styles/liberty', attr: '<a href="https://openfreemap.org">OpenFreeMap</a> &middot; ' + OSM_ATTR },
    // Cleaned variants: the style's layers reading these data layers are
    // dropped before drawing — the one thing raster tiles can never do.
    '__ofm_positron_quiet': { name: '◆ Positron Quiet', vector: 'https://tiles.openfreemap.org/styles/positron', attr: '<a href="https://openfreemap.org">OpenFreeMap</a> &middot; ' + OSM_ATTR,
                              strip: ['transportation_name', 'aerodrome_label', 'aeroway', 'boundary'] },
    '__ofm_liberty_nopoi':  { name: '◆ Liberty, no POI', vector: 'https://tiles.openfreemap.org/styles/liberty', attr: '<a href="https://openfreemap.org">OpenFreeMap</a> &middot; ' + OSM_ATTR,
                              strip: ['poi', 'aerodrome_label'] },
    '__vt_colorful':  { name: '◆ VersaTiles Colorful', vector: 'https://tiles.versatiles.org/assets/styles/colorful/style.json', attr: 'VersaTiles &middot; ' + OSM_ATTR },
    '__vt_muted':     { name: '◆ VersaTiles Muted', vector: 'https://tiles.versatiles.org/assets/styles/muted/style.json', attr: 'VersaTiles &middot; ' + OSM_ATTR },
  };

  // Default: slot 0 = OSM current, slots 1-3 = the three candidates
  const DEFAULT_SLOTS = ['__ofm_positron', '__ofm_positron_quiet', '__ofm_liberty_nopoi'];

  // Sample places to show marker visibility
  const SAMPLE_PLACES = [
    { lat: 48.1351, lon: 11.5820, type: 'playground' },
    { lat: 48.1380, lon: 11.5700, type: 'park' },
    { lat: 48.1345, lon: 11.5680, type: 'swimming_pool' },
    { lat: 48.1400, lon: 11.5780, type: 'playground' },
    { lat: 48.1330, lon: 11.5750, type: 'park' },
    { lat: 48.1365, lon: 11.5850, type: 'swimming_pool' },
  ];

  const TYPE_CONFIG = {
    playground:    { color: '#f45436', symbol: '\u25B2' },
    park:          { color: '#3a9a5c', symbol: '\u25CF' },
    swimming_pool: { color: '#2b7abf', symbol: '\u25A0' },
  };

  let maps = [];
  let slotLayers = [null, null, null]; // slots 1-3
  let activeStyles = [...DEFAULT_SLOTS];
  let syncing = false;

  function init() {
    createMaps();
    buildStylePicker();
    addSampleMarkers();
    initFilters();

    for (let i = 0; i < 3; i++) setStyle(i, activeStyles[i]);
  }

  function createMaps() {
    for (let i = 0; i < 4; i++) {
      const m = L.map(`map${i}`, {
        zoomControl: i === 0,
        attributionControl: true,
      }).setView(MUNICH, ZOOM);

      // Sync movement across all 4 maps
      m.on('moveend zoomend', () => syncMaps(m));
      m.on('move', () => syncMaps(m));

      maps.push(m);
    }

    // Slot 0: always OSM Standard (current app tiles)
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });
    measureTileLoad(osmLayer, 'map0');
    osmLayer.addTo(maps[0]);
  }

  function syncMaps(source) {
    if (syncing) return;
    syncing = true;
    const center = source.getCenter();
    const zoom = source.getZoom();
    maps.forEach(m => {
      if (m !== source) {
        m.setView(center, zoom, { animate: false });
      }
    });
    syncing = false;
  }

  // A vector style, minus every style layer that draws from a stripped
  // data layer (e.g. 'poi' = shops, churches, petrol stations…).
  async function loadStyle(style) {
    if (!style.strip) return style.vector;
    const json = await (await fetch(style.vector)).json();
    json.layers = json.layers.filter(l => !style.strip.includes(l['source-layer']));
    return json;
  }

  async function setStyle(slotIndex, styleId) {
    const mapIndex = slotIndex + 1;
    const style = STYLES[styleId];
    if (!style) return;

    if (slotLayers[slotIndex]) {
      maps[mapIndex].removeLayer(slotLayers[slotIndex]);
      slotLayers[slotIndex] = null;
    }
    activeStyles[slotIndex] = styleId;

    const vectorStyle = style.vector ? await loadStyle(style) : null;
    if (activeStyles[slotIndex] !== styleId) return; // another style picked meanwhile

    const layer = style.vector
      ? L.maplibreGL({ style: vectorStyle, attribution: style.attr })
      : L.tileLayer(style.raster, { maxZoom: 19, attribution: style.attr, className: style.className || '' });

    document.getElementById(`label${mapIndex}`).innerHTML = style.name;
    if (!style.vector) measureTileLoad(layer, `map${mapIndex}`);
    layer.addTo(maps[mapIndex]);
    if (style.vector) measureVectorLoad(layer, `map${mapIndex}`);
    slotLayers[slotIndex] = layer;
  }

  function buildStylePicker() {
    const picker = document.getElementById('stylePicker');
    const ALL_STYLES = {};
    Object.entries(STYLES).forEach(([id, st]) => { if (id !== '__osm') ALL_STYLES[id] = st.name; });

    for (let slot = 0; slot < 3; slot++) {
      const slotLabel = document.createElement('span');
      slotLabel.className = 'picker-label';
      slotLabel.style.marginLeft = slot > 0 ? '16px' : '0';
      slotLabel.textContent = `#${slot + 2}:`;
      picker.appendChild(slotLabel);

      Object.entries(ALL_STYLES).forEach(([id, name]) => {
        const btn = document.createElement('button');
        btn.className = 'style-btn';
        btn.textContent = name;
        btn.dataset.slot = slot;
        btn.dataset.style = id;
        if (activeStyles[slot] === id) btn.classList.add('active');
        btn.addEventListener('click', () => {
          picker.querySelectorAll(`[data-slot="${slot}"]`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          setStyle(slot, id);
        });
        picker.appendChild(btn);
      });
    }
  }

  // ── Filter controls ───────────────────────────

  function initFilters() {
    const sliders = [
      { id: 'f-sepia',  val: 'v-sepia',  suffix: '%' },
      { id: 'f-sat',    val: 'v-sat',    suffix: '%' },
      { id: 'f-bright', val: 'v-bright', suffix: '%' },
      { id: 'f-hue',    val: 'v-hue',    suffix: '°' },
    ];

    sliders.forEach(({ id, val, suffix }) => {
      const slider = document.getElementById(id);
      slider.addEventListener('input', () => {
        document.getElementById(val).textContent = slider.value + suffix;
        applyFilter();
      });
    });

    document.getElementById('resetFilter').addEventListener('click', () => {
      document.getElementById('f-sepia').value = 0;
      document.getElementById('f-sat').value = 100;
      document.getElementById('f-bright').value = 100;
      document.getElementById('f-hue').value = 0;
      sliders.forEach(({ id, val, suffix }) => {
        document.getElementById(val).textContent = document.getElementById(id).value + suffix;
      });
      applyFilter();
    });

    document.getElementById('cssOutput').addEventListener('click', () => {
      const text = document.getElementById('cssOutput').textContent;
      navigator.clipboard.writeText(text).catch(() => {});
    });
  }

  function applyFilter() {
    const sepia  = document.getElementById('f-sepia').value;
    const sat    = document.getElementById('f-sat').value;
    const bright = document.getElementById('f-bright').value;
    const hue    = document.getElementById('f-hue').value;

    const parts = [];
    if (+sepia  !== 0)   parts.push(`sepia(${sepia}%)`);
    if (+sat    !== 100) parts.push(`saturate(${sat}%)`);
    if (+bright !== 100) parts.push(`brightness(${bright}%)`);
    if (+hue    !== 0)   parts.push(`hue-rotate(${hue}deg)`);

    const filterVal = parts.length ? parts.join(' ') : 'none';

    // Apply to the tile pane of every map
    maps.forEach(m => {
      const pane = m.getPanes().tilePane;
      if (pane) pane.style.filter = filterVal === 'none' ? '' : filterVal;
    });

    document.getElementById('cssOutput').textContent = `filter: ${filterVal}`;
  }

  function addSampleMarkers() {
    SAMPLE_PLACES.forEach(place => {
      const cfg = TYPE_CONFIG[place.type];

      const markerHtml = `<svg viewBox="0 0 28 36" width="28" height="36" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 1C14 1 1 11 1 19a13 13 0 0 0 26 0C27 11 14 1 14 1z" fill="${cfg.color}" stroke="white" stroke-width="1.5"/>
        <text x="14" y="22" text-anchor="middle" font-size="11" fill="white" font-weight="bold">${cfg.symbol}</text>
      </svg>`;

      const icon = L.divIcon({
        className: 'place-marker',
        iconSize: [28, 36],
        iconAnchor: [14, 36],
        html: markerHtml
      });

      // Add to all 4 maps
      maps.forEach(m => {
        L.marker([place.lat, place.lon], { icon, interactive: false }).addTo(m);
      });
    });

    // Add legend to first map only
    const legendEl = document.createElement('div');
    legendEl.className = 'legend';
    legendEl.innerHTML = `
      <div class="legend-item"><span class="legend-dot" style="background:#f45436"></span> Playground</div>
      <div class="legend-item"><span class="legend-dot" style="background:#3a9a5c"></span> Park</div>
      <div class="legend-item"><span class="legend-dot" style="background:#2b7abf"></span> Pool</div>
    `;
    document.getElementById('map0').parentElement.appendChild(legendEl);
  }

  function showLoadTime(mapId, ms) {
    const label = document.getElementById(mapId).parentElement.querySelector('.map-label');
    const cls = ms < 800 ? 'fast' : ms < 1500 ? 'medium' : 'slow';
    const badge = document.createElement('span');
    badge.className = `load-time ${cls}`;
    badge.textContent = `${ms}ms`;
    const prev = label.querySelector('.load-time');
    if (prev) prev.remove();
    label.appendChild(badge);
  }

  // Vector: time until MapLibre has fetched AND drawn the view — on a phone,
  // the drawing is the part that matters.
  function measureVectorLoad(layer, mapId) {
    const start = performance.now();
    const ml = layer.getMaplibreMap();
    if (ml) ml.once('idle', () => showLoadTime(mapId, Math.round(performance.now() - start)));
  }

  function measureTileLoad(layer, mapId) {
    const label = document.getElementById(mapId).parentElement.querySelector('.map-label');
    // Remove old timing badge
    const old = label.querySelector('.load-time');
    if (old) old.remove();

    let tileCount = 0;
    let loadedCount = 0;
    const start = performance.now();

    layer.on('tileloadstart', () => { tileCount++; });
    layer.on('tileload', () => {
      loadedCount++;
      if (loadedCount === tileCount) showLoadTime(mapId, Math.round(performance.now() - start));
    });
  }

  init();
})();
</script>
</body>
</html>
