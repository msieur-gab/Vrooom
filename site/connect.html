<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vrooom — Connect &amp; Print</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
</head>
<body>

  <!-- Nav -->
  <nav class="site-nav no-print">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="96" fill="#f45436"/>
        <g transform="translate(256,256) scale(2.5)" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-60 10 L-50 -15 L-25 -30 L30 -30 L50 -15 L60 10 L60 25 L-60 25 Z"/>
          <circle cx="-35" cy="25" r="12" fill="white"/>
          <circle cx="35" cy="25" r="12" fill="white"/>
          <circle cx="-35" cy="25" r="5" fill="#f45436"/>
          <circle cx="35" cy="25" r="5" fill="#f45436"/>
          <line x1="-45" y1="-5" x2="-30" y2="-5"/>
          <line x1="30" y1="-5" x2="45" y2="-5"/>
        </g>
      </svg>
      <span>Vrooom</span>
    </a>
    <a href="index.html" class="nav-link">Home</a>
  </nav>

  <!-- State 1: QR session -->
  <div id="connect-state" class="connect-container">
    <h1>Connect Your Phone</h1>
    <p class="connect-subtitle">Beam your badges from phone to computer for printing</p>

    <div class="qr-wrapper">
      <div id="qr"></div>
      <div class="session-id" id="session-label"></div>
      <p class="qr-instructions">
        Open <strong>Vrooom</strong> on your phone &rarr; tap <strong>Connect</strong> &rarr; scan this code
      </p>
    </div>

    <p class="connect-status" id="status-text">Waiting for connection&hellip;</p>
  </div>

  <!-- State 2: Badge sheet (hidden until data arrives) -->
  <div id="badge-state" class="connect-container" style="display: none;">
    <div class="badge-sheet-header">
      <h1 id="sheet-title">Badge Sheet</h1>
      <p class="badge-sheet-car" id="sheet-car"></p>
    </div>
    <p class="badge-sheet-subtitle">Cut along the dotted lines, color in, and glue into your travel passport!</p>

    <div class="badge-print-grid" id="print-grid"></div>

    <button class="print-btn no-print" onclick="window.print()">Print Badge Sheet</button>

    <p class="no-print" style="text-align:center; margin-top:16px;">
      <a href="connect.html" style="color: var(--muted); font-size: 14px;">Start a new session</a>
    </p>
  </div>

  <!-- Vendored QR generator (Kazuhiko Arase, MIT) — no CDN, so the connect
       page works even when a CDN is blocked or down. -->
  <script src="vendor/qrcode.js"></script>

  <script type="module">
    import { playgroundBadgeSVG, regularBadgeSVG, milestoneBadgeSVG } from '../js/services/badge-svg.js';
    import { milestoneByThreshold } from '../js/services/milestones.js';
    import { SYNC_PATH, POLL_INTERVAL_MS, SESSION_TTL_MS } from '../js/config.js';

    const connectEl = document.getElementById('connect-state');
    const badgeEl = document.getElementById('badge-state');
    const statusText = document.getElementById('status-text');
    const sessionLabel = document.getElementById('session-label');

    // Unambiguous alphabet — no I/O/0/1 to misread off a screen.
    const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    function newSessionId() {
      const bytes = crypto.getRandomValues(new Uint8Array(8));
      return Array.from(bytes, b => ALPHABET[b % ALPHABET.length]).join('');
    }

    const sessionId = newSessionId();

    // The QR holds a real URL, so scanning it with a plain camera app lands on
    // this page rather than showing a meaningless code.
    const connectUrl = new URL(location.href);
    connectUrl.search = `?s=${sessionId}`;

    const qr = qrcode(0, 'M');
    qr.addData(connectUrl.href);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createImgTag(6, 8, 'Vrooom connect code');
    sessionLabel.textContent = sessionId;

    // — Poll the relay until the phone uploads —

    const endpoint = new URL(`${SYNC_PATH}?id=${sessionId}`, location.origin).href;
    const startedAt = Date.now();
    let timer = null;

    async function poll() {
      if (Date.now() - startedAt > SESSION_TTL_MS) {
        clearInterval(timer);
        statusText.textContent = 'This code expired. Refresh the page for a new one.';
        statusText.classList.remove('connected');
        return;
      }

      try {
        const res = await fetch(endpoint, { cache: 'no-store' });
        if (res.status === 204) return;            // nothing uploaded yet
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        clearInterval(timer);
        renderBadges(await res.json());
      } catch (err) {
        statusText.textContent = navigator.onLine
          ? 'Trouble reaching the Vrooom server \u2014 still trying\u2026'
          : 'This computer appears to be offline.';
      }
    }

    timer = setInterval(poll, POLL_INTERVAL_MS);
    poll();

    // — Render the badge sheet —

    function renderBadges(data) {
      const { user, car, badges } = data;

      document.getElementById('sheet-title').textContent = user
        ? `${user}'s Badge Sheet`
        : 'Badge Sheet';

      const subtitle = document.getElementById('sheet-car');
      if (subtitle) subtitle.textContent = car ? `Driving the ${car}` : '';

      const cells = [];

      // Milestones arrive as thresholds; their titles are the same everywhere.
      for (const threshold of badges.milestones || []) {
        const m = milestoneByThreshold(threshold);
        if (m) cells.push(milestoneBadgeSVG(m.title, m.threshold));
      }

      // Playground and regular badges arrive as counts only — no place names
      // ever leave the phone, so captions are left blank for now.
      // See BADGE-NAMING-TODO.md.
      for (let i = 0; i < (badges.regulars || 0); i++) cells.push(regularBadgeSVG(''));
      for (let i = 0; i < (badges.playgrounds || 0); i++) cells.push(playgroundBadgeSVG(''));

      const grid = document.getElementById('print-grid');

      if (cells.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;">No badges earned yet. Go explore some playgrounds!</p>';
      } else {
        const remainder = cells.length % 3;
        const padding = remainder === 0 ? 0 : 3 - remainder;
        grid.innerHTML = cells.map(svg => `<div class="badge-print-cell">${svg}</div>`).join('')
          + '<div class="badge-print-cell empty"></div>'.repeat(padding);
      }

      connectEl.style.display = 'none';
      badgeEl.style.display = 'block';
    }

    // Expose for console testing
    window.renderBadges = renderBadges;
  </script>

</body>
</html>
